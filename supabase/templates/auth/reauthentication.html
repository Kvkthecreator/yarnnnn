<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<style>
  /* Only ever ADDITIVE — the inlined light palette stands alone where this
     block is stripped (most clients). Never put layout or meaning here. */
  @media (prefers-color-scheme: dark) {
    .y-canvas { background:#09090b !important; }
    .y-card { background:#18181b !important; border-color:#27272a !important; }
    .y-heading, .y-mark { color:#fafafa !important; }
    .y-body { color:#d4d4d8 !important; }
    .y-muted { color:#a1a1aa !important; }
    .y-rule { border-color:#27272a !important; }
  }
</style>
</head>
<body class="y-canvas" style="margin:0;padding:0;background:#fafafa;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">Your verification code.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="y-canvas" style="background:#fafafa;">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
             class="y-card"
             style="max-width:520px;background:#ffffff;border:1px solid #e4e4e7;border-radius:14px;">
        <tr>
          <td style="padding:32px 32px 0 32px;">
            <p class="y-mark" style="margin:0 0 24px 0;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;font-size:19px;font-weight:600;letter-spacing:-0.02em;color:#111111;">
              yarnnn
            </p>
            <h1 class="y-heading" style="margin:0 0 12px 0;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;font-size:21px;line-height:1.35;font-weight:600;letter-spacing:-0.01em;color:#111111;">
              Your verification code
            </h1>
            <p class="y-body" style="margin:0 0 12px 0;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;font-size:15px;line-height:1.6;color:#3f3f46;">Enter this code to confirm it's you:</p><p style="margin:8px 0 16px 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:28px;font-weight:600;letter-spacing:0.2em;color:#111111;">{{ .Token }}</p>
            
            
          </td>
        </tr>
        
        <tr>
          <td style="padding:0 32px 32px 32px;">
            <div style="border-top:1px solid #e4e4e7;margin:28px 0 0 0;"></div>
            <p style="margin:16px 0 0 0;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;font-size:12px;line-height:1.6;color:#71717a;">
              The code expires shortly. If you didn't request it, ignore this email.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
