name: shell-windows

# ADR-661 §7o / ADR-663 — build the desktop app's Windows installer.
#
# The installer carries only the native host and its bootstrap page: the
# interface is the website, loaded at launch (ADR-663 D1), so nothing from
# web/ is built here and no Supabase value is frozen in. A Windows installer
# still needs Windows (the resource compiler, NSIS), which is why this runs on
# a Windows runner rather than a developer's Mac.
#
# Manual on purpose: an installer is a release act, not a side effect of a
# push. Run it from the Actions tab (or `gh workflow run shell-windows.yml`),
# download the `yarnnn-windows` artifact, and tag the commit
# `desktop-vX.Y.Z` (the version is src-tauri/Cargo.toml's — ADR-663 D2).
#
# ⚠️ UNSIGNED. Windows SmartScreen warns on first run ("Windows protected your
# PC" → More info → Run anyway) until a code-signing certificate is added —
# see docs/infrastructure/publishing-the-desktop-app.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build the installer
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2.11.5 build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: yarnnn-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
