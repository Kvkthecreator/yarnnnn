# ADR-661 §8 step 4 — the desktop host.
#
# This crate is the HOST, not the product: it opens a window onto the website
# (ADR-663 D1) and owns what a browser tab cannot do (a real window, the system
# browser hand-off, the `yarnnn://` return leg). Product behaviour stays in
# `web/`.
#
# `version` below is the desktop app's ONE version (ADR-663 D2): tauri.conf.json
# carries none, so Tauri reads this; macOS and Windows share it; a build handed
# to anyone is tagged `desktop-vX.Y.Z`. The API's DESKTOP_MIN_VERSION
# (api/services/desktop_client.py) is compared against it.
[package]
name = "yarnnn"
version = "0.4.0"
description = "yarnnn — shared memory for AI + human work"
authors = ["yarnnn"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
# The system-browser handoff (ADR-661 §4.3). `openExternal` in the web bundle
# calls window.open(_blank); this plugin is what makes that leave the app.
tauri-plugin-opener = "2"
# ADR-661 §7o — Windows delivers a deep link by launching a second copy of the
# app; this forwards it to the running one. `deep-link` makes the forwarded
# URL arrive as the same `on_open_url` event macOS delivers natively.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# ADR-662 D15 — the relay to the yarnnn Chrome extension: its socket, its
# waits. Already in the tree through Tauri.
tokio = { version = "1", features = ["time", "net", "io-util", "sync"] }

[features]
# Tauri's own; kept as generated.
custom-protocol = ["tauri/custom-protocol"]
