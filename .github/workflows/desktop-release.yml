name: desktop-release

# ADR-663 — build the desktop app's installers, both platforms, from one tag.
#
# The installer carries only the native host and its bootstrap page: the
# interface is the website, loaded at launch (ADR-663 D1), so nothing from web/
# is built here and no web value is frozen in.
#
# A release is ONE act: bump `version` in src-tauri/Cargo.toml (ADR-663 D2),
# push it, then push the tag `desktop-vX.Y.Z` on that commit. This workflow
# builds the Mac and Windows installers from the tagged commit and keeps them
# as this run's artifacts. `scripts/publish-desktop-release.sh X.Y.Z` then
# takes THIS run's builds of the tag and puts them where the download links
# read. The job stays read-only: it builds, the operator's machine publishes,
# so the storage key never lives in CI.
#
# Run by hand (Actions tab, or `gh workflow run desktop-release.yml`) to try a
# build of main without releasing it.
#
# ⚠️ UNSIGNED until the certificates exist — docs/infrastructure/
# publishing-the-desktop-app.md. The Mac build is ad-hoc SEALED (tauri.conf.json
# `signingIdentity: "-"`), which opens after Privacy & Security → Open Anyway;
# Windows SmartScreen warns once. When the APPLE_* secrets below are set, Tauri
# signs with the Developer ID and notarizes instead — nothing else changes.

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            runner: macos-latest   # Apple Silicon
            bundles: app,dmg
            out: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: windows
            runner: windows-latest
            bundles: nsis
            out: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # A tag names the version it releases; Cargo.toml is where the version
      # lives. If they disagree, the installers would carry a different number
      # than the tag that published them.
      - name: The tag is the host's version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#desktop-v}"
          have="$(sed -nE 's/^version = "([^"]+)"/\1/p' src-tauri/Cargo.toml | head -1)"
          [[ "$want" == "$have" ]] || { echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $have"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Developer ID signing + notarization, once the secrets exist. Exported
      # only when set: Tauri reads an EMPTY variable as "sign with nothing".
      - name: Apple signing (when configured)
        if: matrix.platform == 'mac'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -n "${!v}" ]]; then echo "$v=${!v}" >> "$GITHUB_ENV"; fi
          done
          if [[ -n "$APPLE_SIGNING_IDENTITY" ]]; then echo "▸ Developer ID signing + notarization"; else echo "▸ ad-hoc sealed (no Developer ID yet)"; fi

      - name: Build the installer
        working-directory: src-tauri
        shell: bash
        run: npx --yes @tauri-apps/cli@2.11.5 build --bundles ${{ matrix.bundles }}

      # A seal that does not verify is what macOS calls "damaged" — a wall, not
      # a warning. Refuse to keep a build that would meet it.
      - name: The Mac seal verifies
        if: matrix.platform == 'mac'
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/yarnnn.app

      - uses: actions/upload-artifact@v4
        with:
          name: yarnnn-${{ matrix.platform }}
          path: ${{ matrix.out }}
          if-no-files-found: error
