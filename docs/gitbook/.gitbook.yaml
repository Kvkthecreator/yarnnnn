# This directory IS the published docs site: https://yarnnn.gitbook.io/docs
#
# GitBook Git Sync maps this directory to the docs space and syncs BOTH ways.
# A push to main publishes; an edit made in the GitBook editor is committed back
# here (see 58cf2ea, "GITBOOK-11"). Treat every file under docs/gitbook/ as
# public, member-facing prose — not internal canon. Internal canon lives in
# docs/architecture/ and docs/adr/ and is never published.
#
# These values are the defaults the sync has always run on; they are written
# down so the pipeline is legible from the repo, not only from the dashboard.
# Paths are relative to `root`.
root: ./

structure:
  readme: README.md
  summary: SUMMARY.md

# A published URL outlives the page behind it. `your-first-week` was live and
# linkable; it merged into how-to-use-yarnnn (2026-09-18), so the old path is
# redirected rather than left to 404 for anyone who bookmarked or linked it.
redirects:
  getting-started/your-first-week: getting-started/how-to-use-yarnnn.md
